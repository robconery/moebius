name: Elixir CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test
      PGUSER: postgres
      PGPASSWORD: postgres

    services:
      db:
        image: postgres
        ports: ['5432:5432']
        env:
          POSTGRES_DB: moebius_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4

    - name: Setup Elixir
      uses: erlef/setup-beam@v1
      with:
        version-type: strict
        version-file: .tool-versions

    - name: Restore dependencies cache
      uses: actions/cache@v4
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-

    - name: Install dependencies
      run: |
        mix local.rebar --force
        mix local.hex --force
        mix deps.get

    - name: Set up test data
      run: |
        mix moebius.migrate
        mix moebius.seed

    - name: Check warnings
      # Fails on warnings in Moebius's own lib/. postgrex 0.19's generated
      # BitString code (compiled into PostgresTypes) warns on Elixir 1.20+ and
      # can't be fixed without upgrading the driver, so deps/ warnings are ignored.
      run: |
        mix deps.compile
        mix compile --force 2>&1 | tee compile.log
        if grep -E '└─ lib/' compile.log; then
          echo "::error::Compiler warnings in lib/"
          exit 1
        fi

    - name: Run tests
      run: |
        mix test

    - name: Check code quality, security and format
      run: |
        mix quality --strict
